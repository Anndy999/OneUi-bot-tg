name: VPS CI

# VPS deployment and updates are performed explicitly on the VPS.
# Keep this check available for manual verification without sending an email
# for every repository push.
on:
  workflow_dispatch:

concurrency:
  group: oneui-vps-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and security check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Scan repository for committed credentials
        run: npm run security-check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
