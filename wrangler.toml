[[kv_namespaces]]
binding = "FIRMWARE_KV"
id = "00000000000000000000000000000000"

[[durable_objects.bindings]]
name = "MONITOR_SCHEDULER"
class_name = "MonitorScheduler"

[[durable_objects.bindings]]
name = "FIRMWARE_QUERY_COORDINATOR"
class_name = "FirmwareQueryCoordinator"

[[migrations]]
tag = "v1-monitor-scheduler"
new_sqlite_classes = ["MonitorScheduler"]

[[migrations]]
tag = "v2-firmware-query-coordinator"
new_sqlite_classes = ["FirmwareQueryCoordinator"]

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "oneui-firmware-notifications"

[[queues.consumers]]
queue = "oneui-firmware-notifications"
max_batch_size = 10
max_batch_timeout = 0
max_retries = 5
max_concurrency = 2
dead_letter_queue = "oneui-firmware-notifications-dlq"
retry_delay = 30
