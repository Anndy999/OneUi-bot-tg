QUERY_COORDINATOR_CACHE_MS = "3000"
QUERY_COORDINATOR_STORAGE_CACHE_SECONDS = "15"
QUERY_COORDINATOR_NEGATIVE_CACHE_SECONDS = "30"
RELEASE_WINDOW_ENABLED = "true"
